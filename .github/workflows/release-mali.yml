# Builds the APK, signs it with the release key from the repository's Actions secrets, and publishes it as a GitHub
# release. Runs when .github/RELEASE_TAG changes on main (it holds the tag to create), or by hand.
#
# Secrets (Settings > Secrets and variables > Actions), the same four release.yml uses:
#   RELEASE_KEYSTORE_BASE64  the keystore file, base64-encoded
#   RELEASE_STORE_PASSWORD   the keystore password
#   RELEASE_KEY_ALIAS        the key alias
#   RELEASE_KEY_PASSWORD     the key password
#
# It never falls back to the public test key in tools/test-signing: a release anyone could re-sign would let a
# look-alike APK install over it.
name: Publish Mali release

on:
  push:
    branches: [main]
    paths: [".github/RELEASE_TAG"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create, e.g. v2.4.2-mali.1; defaults to .github/RELEASE_TAG
        required: false
      title:
        description: Release title
        required: false
      notes:
        description: Release notes (Markdown); defaults to .github/RELEASE_NOTES.md
        required: false

permissions:
  contents: write

concurrency:
  group: release-mali
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;35.0.0" "ndk;27.3.13750724" "cmake;3.22.1" > /dev/null

      - name: Fetch bundled components
        run: tools/fetch_components.sh

      # The Secrets Gradle plugin refuses to configure the project without local.properties.
      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Set up signing
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::RELEASE_KEYSTORE_BASE64 is not set"; exit 1; fi
          mkdir -p app/keystores
          echo "$KEYSTORE_BASE64" | base64 -d > app/keystores/release.p12
          {
            echo "storeFile=keystores/release.p12"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > app/keystores/keystore.properties

      - name: Build
        run: ./gradlew --no-daemon :app:assembleModernRelease

      - name: Verify the signature
        run: |
          apk=app/build/outputs/apk/modern/release/app-modern-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" | tee certs.txt
          if grep -q -e "CN=Android Debug" -e "CN=WoW Forever Mali test builds" certs.txt; then
            echo "::error::APK is signed with a debug or test key"; exit 1
          fi

      - name: Remove signing files
        if: always()
        run: rm -rf app/keystores/release.p12 app/keystores/keystore.properties

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TITLE: ${{ inputs.title }}
          NOTES: ${{ inputs.notes }}
        run: |
          if [ -z "$TAG" ]; then TAG=$(tr -d '[:space:]' < .github/RELEASE_TAG); fi
          cp app/build/outputs/apk/modern/release/app-modern-release.apk WoW-Forever-Mali.apk
          if [ -n "$NOTES" ]; then printf '%s\n' "$NOTES" > notes.md; else cp .github/RELEASE_NOTES.md notes.md; fi
          gh release create "$TAG" WoW-Forever-Mali.apk \
            --target "$(git rev-parse HEAD)" \
            --title "${TITLE:-WoW Forever for Android (Mali) $TAG}" \
            --notes-file notes.md
