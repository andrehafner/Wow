# Builds the APK from the chosen ref, signs it with the public test key in tools/test-signing, and publishes it as a
# GitHub release. Run by hand only. The test key is the one "Build test APK" uses, so a release installs over a test
# build and the other way round; because that key is public, the release notes should say where the APK came from.
# For a privately signed release use release.yml, which takes its key from the repository's Actions secrets.
name: Publish test-signed release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create, e.g. v2.4.2-mali.1
        required: true
      title:
        description: Release title
        required: false
      notes:
        description: Release notes (Markdown)
        required: false

permissions:
  contents: write

concurrency:
  group: release-test
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;35.0.0" "ndk;27.3.13750724" "cmake;3.22.1" > /dev/null

      - name: Fetch bundled components
        run: tools/fetch_components.sh

      # The Secrets Gradle plugin refuses to configure the project without local.properties.
      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Set up test signing
        run: |
          mkdir -p app/keystores
          cp tools/test-signing/test.p12 app/keystores/test.p12
          {
            echo "storeFile=keystores/test.p12"
            echo "storePassword=wowtest"
            echo "keyAlias=wowtest"
            echo "keyPassword=wowtest"
          } > app/keystores/keystore.properties

      - name: Build
        run: ./gradlew --no-daemon :app:assembleModernRelease

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TITLE: ${{ inputs.title }}
          NOTES: ${{ inputs.notes }}
        run: |
          cp app/build/outputs/apk/modern/release/app-modern-release.apk WoW-Forever-Mali.apk
          gh release create "$TAG" WoW-Forever-Mali.apk \
            --target "$(git rev-parse HEAD)" \
            --title "${TITLE:-WoW Forever for Android (Mali) $TAG}" \
            --notes "${NOTES:-}"
